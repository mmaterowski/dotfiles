font_family JetBrainsMono Nerd Font
font_size 14.0
enable_audio_bell no

# Enable GPU acceleration (usually on by default, but ensure it is)
enable_layout_hacks yes

# Reduce visual effects if needed
cursor_shape block
cursor_blink_interval 0

# Increase scrollback buffer if you need it
scrollback_lines 2000

# Performance tweaks
sync_to_monitor yes
scrollback_pager nvim --noplugin -c "set ft=man nolist showtabline=0 foldcolumn=0 noswapfile" -
