# Tab 1: My Project
new_tab BO vim
layout fat
cd ~/Projects/backoffice
launch zsh -i -l -c 'source ~/.zshrc && nvim .'

# Tab 2: Logs
new_tab nx run / claude
layout fat
cd ~/Projects/backoffice
launch zsh -l -c 'nx serve backoffice --build-target backoffice:build:development,purplewombat-git; exec zsh'
launch claude

# Tab 3: Home shell
new_tab wake up 
layout fat
launch cmatrix
launch btop
